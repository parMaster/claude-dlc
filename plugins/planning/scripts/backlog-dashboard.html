<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backlog</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #dfe3e8; --text: #1d2228; --dim: #6b7480;
    --accent: #2f6fdb; --yes: #1f8a4c; --later: #b7791f; --no: #8a8f98; --warn: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1f24; --panel: #25292e; --line: #363c44; --text: #dbdbdb; --dim: #8b949e;
      --accent: #6ea8fe; --yes: #4ac17f; --later: #e0a84a; --no: #8b949e; --warn: #f0883e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 24px 40px; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--dim); }
  .warning {
    flex-basis: 100%; color: var(--warn); border: 1px solid var(--warn); border-radius: 6px;
    padding: 6px 10px;
  }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
  .tile {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
    text-align: left; color: inherit; font: inherit; cursor: pointer;
  }
  .tile.static { cursor: default; }
  .tile.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .tile b { display: block; font-size: 22px; line-height: 1.2; }
  .tile span { color: var(--dim); font-size: 12px; }
  .controls { display: flex; gap: 8px; margin: 14px 0 10px; }
  input, select {
    background: var(--panel); color: inherit; border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 10px; font: inherit;
  }
  input { flex: 1; min-width: 0; }
  input:focus, select:focus, .tile:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip {
    background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
    color: var(--dim); font: inherit; font-size: 12px; cursor: pointer;
  }
  .chip.on { color: var(--accent); border-color: var(--accent); }
  .row { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
  .head { display: flex; gap: 12px; padding: 10px 12px; cursor: pointer; align-items: flex-start; }
  .badge {
    flex: none; width: 46px; text-align: center; border-radius: 4px; padding: 1px 0; margin-top: 4px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; color: #fff; background: var(--no);
  }
  .badge.yes { background: var(--yes); }
  .badge.later { background: var(--later); }
  .title, pre.body {
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 16px; font-weight: 600;
  }
  .title { font-weight: 700; }
  .meta { color: var(--dim); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 12px; }
  .flag { color: var(--warn); }
  pre.body {
    margin: 0; padding: 10px 12px 12px 70px; border-top: 1px solid var(--line);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .empty { color: var(--dim); padding: 24px 0; text-align: center; }
  [hidden] { display: none; }
</style>
</head>
<body>
<noscript><p class="warning">This page needs JavaScript. Reopen it with <code>overlay.sh html &lt;file&gt; --js</code>, or in a browser.</p></noscript>
<header id="header"></header>
<div class="tiles" id="tiles"></div>
<div class="controls">
  <input id="search" type="search" placeholder="Search title, slug, where, body ( / ) · q quits" autocomplete="off">
  <select id="sort" aria-label="Sort">
    <option value="newest">newest first</option>
    <option value="oldest">oldest first</option>
    <option value="triage">yes, later, no · oldest first</option>
    <option value="touched">recently touched</option>
  </select>
</div>
<div class="chips" id="chips"></div>
<main id="rows"></main>

<script id="backlog-data" type="application/json">
__BACKLOG_DATA__
</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('backlog-data').textContent);
  var items = data.items;
  var DAY = 864e5;
  var now = Date.now();
  var state = { filter: 'all', area: null, query: '', sort: 'newest' };
  var open = {};

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function days(date) {
    var t = Date.parse(date);
    return isNaN(t) ? null : Math.max(0, Math.floor((now - t) / DAY));
  }
  // YYYY-MM-DD[ HH:MM] shown as YY-MM-DD[ HH:MM]; anything else is shown as written.
  function stamp(s) { return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(2) : s; }
  items.forEach(function (it) {
    it.age = days(it.added);
    it.haystack = [it.title, it.slug, it.where, it.ticket, it.body].join('\n').toLowerCase();
  });

  var filters = {
    all: function () { return true; },
    yes: function (it) { return it.worth === 'yes'; },
    later: function (it) { return it.worth === 'later'; },
    no: function (it) { return it.worth === 'no'; },
    recent: function (it) { return it.age != null && it.age < 7; }
  };
  var tileDefs = [
    ['all', 'all items'], ['yes', 'worth yes'], ['later', 'worth later'], ['no', 'worth no'],
    ['recent', 'added in 7 days']
  ];
  var rank = { yes: 0, later: 1, no: 2 };
  var sorts = {
    triage: function (a, b) {
      var r = (a.worth in rank ? rank[a.worth] : 3) - (b.worth in rank ? rank[b.worth] : 3);
      return r || a.addedAt.localeCompare(b.addedAt) || a.slug.localeCompare(b.slug);
    },
    newest: function (a, b) { return b.addedAt.localeCompare(a.addedAt) || a.slug.localeCompare(b.slug); },
    oldest: function (a, b) { return a.addedAt.localeCompare(b.addedAt) || a.slug.localeCompare(b.slug); },
    touched: function (a, b) { return b.touched.localeCompare(a.touched) || a.slug.localeCompare(b.slug); }
  };

  function renderHeader() {
    var h = document.getElementById('header');
    h.appendChild(el('h1', null, data.repo + ' backlog'));
    var where = (data.branch || 'detached HEAD') + (data.commit ? ' @ ' + data.commit : '');
    h.appendChild(el('span', 'sub', data.count + (data.count === 1 ? ' item' : ' items') + ' · ' + where));
    if (data.offDefault) {
      h.appendChild(el('div', 'warning', 'Not on ' + data.defaultBranch +
        ': this is the branch’s copy of the backlog.'));
    }
    document.title = data.repo + ' backlog';
  }

  function renderTiles() {
    var box = document.getElementById('tiles');
    box.textContent = '';
    tileDefs.forEach(function (def) {
      var t = el('button', 'tile' + (state.filter === def[0] ? ' on' : ''));
      t.type = 'button';
      t.appendChild(el('b', null, String(items.filter(filters[def[0]]).length)));
      t.appendChild(el('span', null, def[1]));
      t.addEventListener('click', function () {
        state.filter = state.filter === def[0] ? 'all' : def[0];
        render();
      });
      box.appendChild(t);
    });
  }

  function renderChips() {
    var box = document.getElementById('chips');
    box.textContent = '';
    var counts = {};
    items.forEach(function (it) { counts[it.area] = (counts[it.area] || 0) + 1; });
    Object.keys(counts).sort().forEach(function (area) {
      var c = el('button', 'chip' + (state.area === area ? ' on' : ''), area + ' ' + counts[area]);
      c.type = 'button';
      c.addEventListener('click', function () {
        state.area = state.area === area ? null : area;
        render();
      });
      box.appendChild(c);
    });
  }

  function renderRows() {
    var box = document.getElementById('rows');
    box.textContent = '';
    var q = state.query.trim().toLowerCase();
    var shown = items.filter(filters[state.filter]).filter(function (it) {
      return (!state.area || it.area === state.area) && (!q || it.haystack.indexOf(q) !== -1);
    }).sort(sorts[state.sort]);
    if (!shown.length) {
      box.appendChild(el('div', 'empty', 'No items match.'));
      return;
    }
    shown.forEach(function (it) {
      var row = el('div', 'row');
      var head = el('div', 'head');
      head.appendChild(el('span', 'badge ' + it.worth, it.worth || '?'));
      var main = el('div');
      main.appendChild(el('div', 'title', it.title));
      var meta = el('div', 'meta');
      meta.appendChild(el('span', 'mono', it.slug));
      if (it.where) meta.appendChild(el('span', 'mono' + (it.whereMissing ? ' flag' : ''),
        it.where + (it.whereMissing ? ' (not found)' : '')));
      if (it.ticket) meta.appendChild(el('span', null, it.ticket));
      meta.appendChild(el('span', null, it.area));
      meta.appendChild(el('span', null, 'added ' + (stamp(it.addedAt) || 'unknown')));
      meta.appendChild(el('span', null, it.touched ? 'touched ' + stamp(it.touched) : 'never committed'));
      if (it.uncommitted) meta.appendChild(el('span', 'flag', 'uncommitted'));
      main.appendChild(meta);
      head.appendChild(main);
      var body = el('pre', 'body', it.body.replace(/^\n+|\s+$/g, ''));
      body.hidden = !open[it.slug];
      head.addEventListener('click', function () {
        open[it.slug] = !open[it.slug];
        body.hidden = !open[it.slug];
      });
      row.appendChild(head);
      row.appendChild(body);
      box.appendChild(row);
    });
  }

  function render() { renderTiles(); renderChips(); renderRows(); }

  var search = document.getElementById('search');
  search.addEventListener('input', function () { state.query = search.value; renderRows(); });
  document.getElementById('sort').addEventListener('change', function (e) {
    state.sort = e.target.value;
    renderRows();
  });
  // The overlay's own close command; a plain browser tab has no such bridge.
  function quit() {
    if (window.agterm && agterm.request) agterm.request('session.overlay.close');
    else window.close();
  }
  document.addEventListener('keydown', function (e) {
    var typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (e.key === '/' && document.activeElement !== search) { e.preventDefault(); search.focus(); }
    else if (e.key === 'Escape' && document.activeElement === search) {
      search.value = ''; state.query = ''; search.blur(); renderRows();
    }
    else if (e.key === 'q' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); quit(); }
  });

  renderHeader();
  render();
})();
</script>
</body>
</html>
